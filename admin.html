<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Sahtekâr Yönetim</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2312151A'/%3E%3Crect x='12' y='20' width='40' height='8' fill='%23F8F9FA'/%3E%3Crect x='12' y='36' width='26' height='8' fill='%231F4FE0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Cairo:wght@400;600;800;900&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css?v=1.0.8">
<style>
  #app { max-width: 760px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .stat { padding: 14px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 2px; }
  .stat b { font-family: var(--font-mono); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
  .room-row { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; text-align: start; width: 100%; padding: 12px 14px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); }
  .room-row .code { font-size: 1.1rem; }
  .room-row .meta { color: var(--muted); font-size: .85rem; grid-column: 2 / 4; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; font-size: .92rem; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .uid { font-family: var(--font-mono); font-size: .85rem; padding: 10px; border-radius: 8px; background: var(--surface); border: 2px dashed var(--line); overflow-wrap: anywhere; user-select: all; }
  .tbl .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .tbl .btn.small { min-height: 34px; padding: 4px 10px; font-size: .82rem; }
  .stat .muted { font-size: .78rem; }
  .bar { display: inline-block; width: 90px; height: 8px; border-radius: 4px; background: var(--line); margin-inline-end: 8px; vertical-align: middle; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--crew); }
</style>
</head>
<body>
<div id="app"><p class="muted">Yükleniyor…</p></div>
<script type="module" src="admin.js?v=1.0.8"></script>
</body>
</html>
